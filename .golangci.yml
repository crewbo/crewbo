version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  exclusions:
    paths:
      - internal/protocol
    rules:
      # Tests build binaries, run subprocesses and read temporary files on
      # purpose; gosec still covers all non-test code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - internal/protocol
