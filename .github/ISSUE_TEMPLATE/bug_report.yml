name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `crewbo version`, `git --version`, your OS, and `claude --version` or `codex --version`.
    validations:
      required: true
