name: ci

# Docs-only changes skip CI to save Actions minutes while the repo is
# private (Free plan: 2,000 min/month, macOS billed about 10x Linux).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on pull requests, the weekly run and manual runs, not on pushes to main.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Same shell on every OS. PowerShell on Windows splits
    # -coverprofile=coverage.out at the dot and treats ".out" as a package.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Skeleton guard: skip Go steps until the first package lands.
      - name: Build
        if: hashFiles('**/*.go') != ''
        run: go build ./...
      - name: Test
        if: hashFiles('**/*.go') != ''
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        if: hashFiles('**/*.go') != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Fetch main for breaking-change detection
        id: main
        if: hashFiles('proto/**/*.proto') != '' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main:main
          if git ls-tree -r --name-only main -- proto | grep -q '\.proto$'; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi
      - name: buf lint and breaking
        if: hashFiles('proto/**/*.proto') != ''
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          lint: true
          format: true
          # Skipped until main has .proto files: there is nothing to compare against.
          breaking: ${{ steps.main.outputs.has_proto == 'true' }}
          breaking_against: .git#branch=main
          push: false
          pr_comment: false
      - name: Check generated code is current
        if: hashFiles('proto/**/*.proto') != ''
        run: |
          buf generate
          git add -A internal/protocol
          git diff --cached --exit-code -- internal/protocol

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose .
