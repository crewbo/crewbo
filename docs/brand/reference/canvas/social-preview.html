<!doctype html>
<!-- Source for assets/png/social-preview-1280x640.png (GitHub repo social preview). Render at 1280x640, device scale 1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crewbo social preview</title>
<style>
  @font-face { font-family: 'Instrument Sans'; font-weight: 400; src: url(../../assets/fonts/instrument-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 600; src: url(../../assets/fonts/instrument-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../../assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; }
  .frame { width: 1280px; height: 640px; box-sizing: border-box; padding: 96px; background: #FFFFFF; color: #0A0A0A; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
  .lockup { display: flex; align-items: center; gap: 24px; }
  .lockup span { font-size: 88px; font-weight: 600; letter-spacing: -2.7px; line-height: 1; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -1.6px; line-height: 1.05; max-width: 900px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .foot code { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #525252; }
  .crew { display: flex; gap: 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="lockup">
    <svg viewBox="0 0 100 100" width="108" height="108" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#0A0A0A"/><rect x="50" y="30" width="8" height="18" rx="1.5" fill="#FFFFFF"/><rect x="66" y="30" width="8" height="18" rx="1.5" fill="#FFFFFF"/></svg>
    <span>crewbo</span>
  </div>
  <h1>Every agent, one crew. Your team's coding agents, working in parallel without collisions.</h1>
  <div class="foot">
    <code>crewbo.dev</code>
    <div class="crew">
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#1D4ED8"/><rect x="47" y="36" width="8" height="18" rx="1.5" fill="#fff"/><rect x="63" y="36" width="8" height="18" rx="1.5" fill="#fff"/></svg>
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#0F766E"/><rect x="38" y="44" width="8" height="18" rx="1.5" fill="#fff"/><rect x="54" y="44" width="8" height="18" rx="1.5" fill="#fff"/></svg>
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#C2410C"/><rect x="38" y="36" width="8" height="18" rx="1.5" fill="#fff"/><rect x="54" y="36" width="8" height="18" rx="1.5" fill="#fff"/></svg>
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#7E22CE"/><rect x="29" y="36" width="8" height="18" rx="1.5" fill="#fff"/><rect x="45" y="36" width="8" height="18" rx="1.5" fill="#fff"/></svg>
    </div>
  </div>
</div>
</body>
</html>
