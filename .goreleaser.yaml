version: 2

builds:
  - id: crewbo
    main: ./cmd/crewbo
    binary: crewbo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The binary includes the AGPL-3.0 sync server and the dashboard's OFL
    # fonts, so every licence ships with it (NOTICE). A files list replaces
    # GoReleaser's defaults. https://goreleaser.com/customization/archive/
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - internal/server/LICENSE
      - web/fonts/LICENSE-*.txt

checksum:
  name_template: checksums.txt
  # The extension is listed too, so one attestation covers every download.
  # https://goreleaser.com/customization/checksum/
  extra_files:
    - glob: ./extension/*.vsix

changelog:
  disable: true

release:
  # The VS Code extension, built by the release workflow before GoReleaser.
  extra_files:
    - glob: ./extension/*.vsix
  draft: true
  prerelease: auto
